name: Download and Extract Apk

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        run: |
          wget -O install.apk "https://github.com/brunodev85/winlator/releases/download/v7.1.0/Winlator_7.1.apk"

      - name: Extract APK
        run: |
          mkdir install_apk
          unzip install.apk -d install_apk

      - name: Search ABI folders
        run: |
          echo "Searching armeabi-v7a:"
          find install_apk -iname "*armeabi-v7a*" -print

          echo ""
          echo "Searching arm64:"
          find install_apk -iname "*arm64*" -print

      - name: Check box64
        run: |
          find install_apk -iname "*box64*"
          find install_apk -iname "*aarch64*"
          find install_apk -iname "*wine64*"
          find install_apk -iname "*x86_64*"
      - name: Check heavy
        run: |
          find install_apk -type f -printf "%12s %p\n" | sort -nr | head -50

      - name: Check imagefs for 64-bit files
        run: |
        mkdir imagefs
        tar -xf install_apk/assets/imagefs.txz -C imagefs

        echo "===== Path contains 64-bit keywords ====="
        find imagefs \( \
          -iname "*arm64*" -o \
          -iname "*aarch64*" -o \
          -iname "*x86_64*" -o \
          -iname "*wine64*" -o \
          -iname "*wow64*" -o \
          -iname "*box64*" -o \
          -iname "*lib64*" \
    \) | sort

        echo
        echo "===== Large files (>1 MB) ====="
        find imagefs -type f -size +1M -printf "%12s %p\n" | sort -nr | head -100